name: email-client-local

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-client:local
    container_name: email-client-local
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: local
      APP_RELEASE: "2.1.0"
      DATABASE_PATH: /app/data/email-client.db
      SESSION_FILE_DIR: /tmp/email-client-sessions
      HOME: /tmp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
