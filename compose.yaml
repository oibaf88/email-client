# Default local Docker configuration for the safe synthetic showcase.
# It intentionally does not start Redis, Docker Mailserver, Caddy, or TLS.
# For the full live production stack, use compose.prod.yaml explicitly.

name: email-client-local

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-client:local
    container_name: email-client-local
    init: true
    environment:
      APP_MODE: showcase
      APP_ENV: development
      APP_RELEASE: local
      SESSION_COOKIE_SECURE: "false"
      SESSION_FILE_DIR: /tmp/email-client-sessions
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
