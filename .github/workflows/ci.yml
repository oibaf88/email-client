name: CI

on:
  push:
    branches:
      - main
      - codex/**
      - local-only/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q app.py tests

      - name: Test
        run: python -m pytest -q

      - name: Validate Compose
        run: docker compose config

      - name: Build and smoke-test local container
        run: |
          docker compose up -d --build
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs web
          exit 1

      - name: Stop local container
        if: always()
        run: docker compose down --remove-orphans
