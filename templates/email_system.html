<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Self-hosted domain email client for IMAP and SMTP submission." />
  <title>Domain Mail</title>

  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-2: #f0f5f6;
      --text: #152126;
      --muted: #66757b;
      --line: #d9e0e2;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --danger: #b42318;
      --ok: #157f3b;
      --shadow: 0 14px 44px rgba(18, 38, 46, 0.10);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 750;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 210px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 2px;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .subtle {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      padding: 0 14px;
    }

    .secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 0 14px;
    }

    .danger {
      background: #fff0ee;
      color: var(--danger);
      border: 1px solid #f2bbb5;
      padding: 0 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px minmax(300px, 410px) minmax(0, 1fr);
      min-height: 0;
    }

    .pane {
      min-height: calc(100vh - 63px);
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .folders {
      padding: 14px;
    }

    .folder-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-weight: 650;
    }

    .folder-button.active {
      background: var(--surface-2);
      color: var(--accent);
    }

    .folder-role {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .list-pane {
      background: #fbfcfc;
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      min-height: 64px;
    }

    .pane-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .message-list {
      padding: 8px;
      overflow-y: auto;
      max-height: calc(100vh - 128px);
    }

    .message-item {
      width: 100%;
      display: grid;
      gap: 5px;
      padding: 12px;
      margin-bottom: 6px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text);
      text-align: left;
    }

    .message-item.active {
      border-color: rgba(15, 118, 110, 0.42);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.08);
    }

    .message-item.unread .subject {
      font-weight: 900;
    }

    .sender-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .subject {
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .reader {
      padding: 18px;
      overflow-y: auto;
      max-height: calc(100vh - 63px);
      background: var(--bg);
    }

    .reader-card,
    .auth-card,
    .compose-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .reader-card {
      min-height: calc(100vh - 100px);
      padding: 20px;
    }

    .message-meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .body {
      white-space: pre-wrap;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 300px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
    }

    .auth-screen {
      min-height: calc(100vh - 63px);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .auth-card,
    .compose-card {
      width: min(520px, 100%);
      padding: 22px;
    }

    .auth-card h2,
    .compose-card h2 {
      margin-bottom: 16px;
      font-size: 1.15rem;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .notice {
      min-height: 22px;
      margin-top: 12px;
      color: var(--ok);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .notice.error {
      color: var(--danger);
    }

    .compose-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(21, 33, 38, 0.38);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .compose-wrap.open {
      display: flex;
    }

    .compose-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 190px minmax(260px, 1fr);
      }

      .reader {
        grid-column: 1 / -1;
        max-height: none;
      }
    }

    @media (max-width: 680px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: stretch;
      }

      .top-actions button {
        flex: 1;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .pane,
      .reader {
        min-height: auto;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">@</div>
        <div>
          <h1>Domain Mail</h1>
          <div id="server-summary" class="subtle">IMAP + SMTP</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="account-label" class="subtle"></span>
        <button id="compose-button" class="primary hidden" type="button">Compose</button>
        <button id="refresh-button" class="secondary hidden" type="button">Refresh</button>
        <button id="logout-button" class="secondary hidden" type="button">Logout</button>
      </div>
    </header>

    <section id="auth-screen" class="auth-screen">
      <form id="login-form" class="auth-card">
        <h2>Sign in</h2>
        <label for="email">Mailbox</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button class="primary" type="submit">Sign in</button>
        <div id="login-notice" class="notice" role="status" aria-live="polite"></div>
      </form>
    </section>

    <main id="mail-layout" class="layout hidden">
      <aside class="pane folders">
        <div id="folders"></div>
      </aside>

      <section class="pane list-pane">
        <div class="pane-head">
          <h2 id="folder-title">Inbox</h2>
          <span id="message-count" class="subtle"></span>
        </div>
        <div id="message-list" class="message-list"></div>
      </section>

      <section class="reader">
        <article id="reader-card" class="reader-card">
          <div class="empty">Select a message</div>
        </article>
      </section>
    </main>

    <section id="compose-wrap" class="compose-wrap" aria-hidden="true">
      <form id="compose-form" class="compose-card">
        <h2>New message</h2>
        <label for="to">To</label>
        <input id="to" name="to" type="text" autocomplete="off" required />
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" autocomplete="off" required />
        <label for="body">Body</label>
        <textarea id="body" name="body" required></textarea>
        <div class="compose-actions">
          <button id="cancel-compose" class="secondary" type="button">Cancel</button>
          <button class="primary" type="submit">Send</button>
        </div>
        <div id="compose-notice" class="notice" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>

  <script>
    const authScreen = document.querySelector('#auth-screen');
    const mailLayout = document.querySelector('#mail-layout');
    const loginForm = document.querySelector('#login-form');
    const loginNotice = document.querySelector('#login-notice');
    const foldersNode = document.querySelector('#folders');
    const messageList = document.querySelector('#message-list');
    const readerCard = document.querySelector('#reader-card');
    const folderTitle = document.querySelector('#folder-title');
    const messageCount = document.querySelector('#message-count');
    const accountLabel = document.querySelector('#account-label');
    const serverSummary = document.querySelector('#server-summary');
    const composeButton = document.querySelector('#compose-button');
    const refreshButton = document.querySelector('#refresh-button');
    const logoutButton = document.querySelector('#logout-button');
    const composeWrap = document.querySelector('#compose-wrap');
    const composeForm = document.querySelector('#compose-form');
    const composeNotice = document.querySelector('#compose-notice');
    const cancelCompose = document.querySelector('#cancel-compose');

    let csrfToken = '';
    let currentFolder = 'INBOX';
    let currentUid = '';
    let folders = [];

    function showNotice(node, message, isError = false) {
      node.textContent = message;
      node.classList.toggle('error', isError);
    }

    async function requestJSON(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (csrfToken && options.method && options.method !== 'GET') {
        headers['X-CSRF-Token'] = csrfToken;
      }

      const response = await fetch(url, { ...options, headers });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || data.message || 'Request failed.');
      }
      return data;
    }

    function escapeHTML(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function setAuthenticated(state) {
      csrfToken = state.csrf_token || csrfToken;
      accountLabel.textContent = state.user || '';
      serverSummary.textContent = [state.imap_host, state.smtp_host].filter(Boolean).join(' / ') || 'IMAP + SMTP';
      authScreen.classList.toggle('hidden', state.authenticated);
      mailLayout.classList.toggle('hidden', !state.authenticated);
      composeButton.classList.toggle('hidden', !state.authenticated);
      refreshButton.classList.toggle('hidden', !state.authenticated);
      logoutButton.classList.toggle('hidden', !state.authenticated);
    }

    function renderFolders() {
      foldersNode.innerHTML = folders.map((folder) => `
        <button class="folder-button ${folder.name === currentFolder ? 'active' : ''}" type="button" data-folder="${escapeHTML(folder.name)}">
          <span>${escapeHTML(folder.display_name || folder.name)}</span>
          <span class="folder-role">${escapeHTML(folder.role || '')}</span>
        </button>
      `).join('');
    }

    function renderMessageList(messages) {
      folderTitle.textContent = currentFolder;
      messageCount.textContent = `${messages.length} shown`;

      if (!messages.length) {
        messageList.innerHTML = '<div class="empty">No messages</div>';
        return;
      }

      messageList.innerHTML = messages.map((message) => `
        <button class="message-item ${message.uid === currentUid ? 'active' : ''} ${message.is_read ? '' : 'unread'}" type="button" data-uid="${message.uid}">
          <span class="sender-row">
            <span>${escapeHTML(message.from || message.to || '(unknown)')}</span>
            <span>${escapeHTML(formatDate(message.date || ''))}</span>
          </span>
          <span class="subject">${escapeHTML(message.subject)}</span>
        </button>
      `).join('');
    }

    function renderReader(message) {
      readerCard.innerHTML = `
        <div class="message-meta">
          <h2>${escapeHTML(message.subject)}</h2>
          <span>From: ${escapeHTML(message.from || '(unknown)')}</span>
          <span>To: ${escapeHTML(message.to || '')}</span>
          <span>Date: ${escapeHTML(formatDate(message.date || ''))}</span>
        </div>
        <div class="body">${escapeHTML(message.body || '')}</div>
        ${message.attachments && message.attachments.length ? `<p class="subtle">${message.attachments.length} attachment(s)</p>` : ''}
        <div class="compose-actions">
          <button class="danger" id="delete-current" type="button">Delete</button>
        </div>
      `;
    }

    async function loadState() {
      const state = await requestJSON('/api/state');
      setAuthenticated(state);
      if (state.authenticated) {
        await loadFolders();
        await loadMessages();
      }
    }

    async function loadFolders() {
      const data = await requestJSON('/api/folders');
      folders = data.folders || [];
      if (!folders.some((folder) => folder.name === currentFolder)) {
        currentFolder = folders[0]?.name || 'INBOX';
      }
      renderFolders();
    }

    async function loadMessages() {
      currentUid = '';
      readerCard.innerHTML = '<div class="empty">Select a message</div>';
      const data = await requestJSON(`/api/messages?folder=${encodeURIComponent(currentFolder)}`);
      renderMessageList(data.messages || []);
    }

    async function openMessage(uid) {
      currentUid = uid;
      await requestJSON(`/api/messages/${encodeURIComponent(uid)}/read?folder=${encodeURIComponent(currentFolder)}`, {
        method: 'POST',
        body: '{}',
      });
      const data = await requestJSON(`/api/messages/${encodeURIComponent(uid)}?folder=${encodeURIComponent(currentFolder)}`);
      renderReader(data.message);
      await refreshMessageListOnly();
    }

    async function refreshMessageListOnly() {
      const data = await requestJSON(`/api/messages?folder=${encodeURIComponent(currentFolder)}`);
      renderMessageList(data.messages || []);
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      showNotice(loginNotice, '');
      try {
        const data = await requestJSON('/api/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.querySelector('#email').value,
            password: document.querySelector('#password').value,
          }),
        });
        setAuthenticated(data);
        await loadFolders();
        await loadMessages();
        loginForm.reset();
      } catch (error) {
        showNotice(loginNotice, error.message, true);
      }
    });

    logoutButton.addEventListener('click', async () => {
      await requestJSON('/api/logout', { method: 'POST', body: '{}' });
      folders = [];
      currentFolder = 'INBOX';
      currentUid = '';
      await loadState();
    });

    refreshButton.addEventListener('click', async () => {
      await loadFolders();
      await loadMessages();
    });

    foldersNode.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-folder]');
      if (!button) return;
      currentFolder = button.dataset.folder;
      renderFolders();
      await loadMessages();
    });

    messageList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-uid]');
      if (!button) return;
      await openMessage(button.dataset.uid);
    });

    readerCard.addEventListener('click', async (event) => {
      if (event.target.id !== 'delete-current' || !currentUid) return;
      await requestJSON(`/api/messages/${encodeURIComponent(currentUid)}?folder=${encodeURIComponent(currentFolder)}`, {
        method: 'DELETE',
        body: '{}',
      });
      currentUid = '';
      await loadMessages();
    });

    composeButton.addEventListener('click', () => {
      composeWrap.classList.add('open');
      composeWrap.setAttribute('aria-hidden', 'false');
      composeNotice.textContent = '';
      document.querySelector('#to').focus();
    });

    cancelCompose.addEventListener('click', () => {
      composeWrap.classList.remove('open');
      composeWrap.setAttribute('aria-hidden', 'true');
      composeForm.reset();
    });

    composeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      showNotice(composeNotice, '');
      try {
        const data = await requestJSON('/api/send', {
          method: 'POST',
          body: JSON.stringify({
            to: document.querySelector('#to').value,
            subject: document.querySelector('#subject').value,
            body: document.querySelector('#body').value,
          }),
        });
        composeForm.reset();
        composeWrap.classList.remove('open');
        composeWrap.setAttribute('aria-hidden', 'true');
        if (data.warning) {
          showNotice(loginNotice, data.warning, true);
        }
        await loadFolders();
        await loadMessages();
      } catch (error) {
        showNotice(composeNotice, error.message, true);
      }
    });

    loadState().catch((error) => showNotice(loginNotice, error.message, true));
  </script>
</body>
</html>
